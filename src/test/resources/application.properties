spring.application.name=SpringZ

# Use an in-memory database for tests so `mvn test` does not depend on local MySQL.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT configuration for tests.
springz.app.jwtSecret=TestSecretKeyAtLeast64BytesLong_0123456789_0123456789_0123456789
springz.app.jwtExpirationMs=3600000
