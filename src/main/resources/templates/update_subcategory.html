<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Modifier SubCategories</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>

<body>
<div class="container my-5">
    <h3> Modifier SubCategories</h3>
    <div class="card">
        <div class="card-body">
            <div class="col-md-10">
                <form th:action="@{/updatesubcategory/{id}(id=${subcategory.id})}" th:object="${subcategory}"
                      method="post">
                    <div class="row">
                        <div class="form-group col-md-8">
                            <label for="name" class="col-form-label">Titre</label>
                            <input type="text" th:field="*{title}" class="form-control"
                                   id="name" placeholder="name" />
                        </div>
                        <div class="form-group col-md-8">
                            <label for="description" class="col-form-label">Description</label>
                            <input type="text" th:field="*{description}" class="form-control"
                                   id="description" placeholder="description" />
                        </div>

                        <div class="form-group col-md-8">
                            <label for="categorieSelect" class="col-form-label">Categorie</label>
                            <select id="categorieSelect" class="form-control" th:field="*{category.id}">
                                <option value="" disabled selected>-- Sélectionner une categorie --</option>
                                <option th:each="cat : ${categoriesList}"
                                        th:value="${cat.id}"
                                        th:text="${cat.title}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <input type="submit" class="btn btn-primary" value=" Submit ">
                        </div>

                        <input type="hidden" id="id" th:field="*{id}">

                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>

</html>
