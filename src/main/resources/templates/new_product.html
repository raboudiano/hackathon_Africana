<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<title>Ajout Produit</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>

<body>
<div class="container my-5">
	<h3>Ajout Produit</h3>
	<div class="card">
		<div class="card-body">
			<div class="col-md-10">
				<form th:action="@{/save}" th:object="${ProductFrom}" method="post">
					<div class="row">
						<div class="form-group col-md-8">
							<label for="name" class="col-form-label">Name</label>
							<input type="text" th:field="*{name}" class="form-control" id="name" placeholder="name"/>
						</div>

						<div class="form-group col-md-8">
							<label for="price" class="col-form-label">Price</label>
							<input type="text" th:field="*{price}" class="form-control" id="price" placeholder="price"/>
						</div>

						<div class="form-group col-md-8">
							<label for="description" class="col-form-label">Description</label>
							<input type="text" th:field="*{description}" class="form-control" id="description" placeholder="description"/>
						</div>

						<div class="form-group col-md-8">
							<label for="providerSelect" class="col-form-label">Provider</label>
							<select id="providerSelect" class="form-control" th:field="*{provider.id}">
								<option value="" disabled selected>-- Sélectionner un provider --</option>
								<option th:each="prov : ${ProviderFrom}"
										th:value="${prov.id}"
										th:text="${prov.name}">
								</option>
							</select>
						</div>

						<div class="form-group col-md-8">
							<label for="subcategorySelect" class="col-form-label">Subcategory</label>
							<select id="subcategorySelect" class="form-control" th:field="*{subcategory.id}">
								<option value="" disabled selected>-- Sélectionner une sous-catégorie --</option>
								<option th:each="s : ${SubcategoryFrom}"
										th:value="${s.id}"
										th:text="${s.title}">
								</option>
							</select>
						</div>

						<div class="col-md-6">
							<input type="submit" class="btn btn-primary" value="Submit">
						</div>

						<input type="hidden" id="id" th:field="*{id}">
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
</body>

</html>
