<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Modifier commande</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>

<body>
<div class="container my-5">
    <h3>Modifier commande</h3>
    <div class="card">
        <div class="card-body">
            <div class="col-md-10">
                <form action="#" th:action="@{/updateOrders/{id}(id=${orders.id})}"
                      th:object="${orders}" method="post">
                    <div class="row">
                        <div class="form-group col-md-8">
                            <label for="ref" class="col-form-label">ref</label>
                            <input type="text" th:field="*{ref}" class="form-control"
                                   id="ref" placeholder="ref" />
                        </div>

                        <div class="form-group col-md-8">
                            <label for="price" class="col-form-label">price</label>
                            <input type="text" th:field="*{price}" class="form-control"
                                   id="price" placeholder="price" />
                        </div>
                        <div class="form-group col-md-8">
                            <label for="date" class="col-form-label">date</label>
                            <input type="date" th:field="*{date}" class="form-control"
                                   id="date" placeholder="date" />
                        </div>

                        <div class="form-group col-md-8">
                            <label for="customerSelect" class="col-form-label">Client</label>
                            <select id="customerSelect" class="form-control" th:field="*{customer.id}">
                                <option value="" disabled selected>-- Sélectionner un client --</option>
                                <option th:each="cus : ${customerList}"
                                        th:value="${cus.id}"
                                        th:text="${cus.name}">
                                </option>
                            </select>
                        </div>

                        <div class="form-group col-md-8">
                            <label>Produits (Ctrl + clic pour plusieurs)</label>
                            <select class="form-control" name="products" multiple>
                                <option th:each="p : ${productList}"
                                        th:value="${p.id}"
                                        th:text="${p.name}"
                                        th:selected="${orders.products != null and orders.products.?[id == p.id].size() > 0}">produit</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <input type="submit" class="btn btn-primary" value=" Submit ">
                        </div>

                        <input type="hidden" id="id" th:field="*{id}">

                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>

</html>
